x-app-service: &app-service
  image: kitsuluh-app:latest
  build:
    context: .
    target: app
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - backend
  volumes:
    - storage-data:/var/www/storage
    - bootstrap-cache:/var/www/bootstrap/cache

services:
  app:
    <<: *app-service
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: kitsuluh-web:latest
    build:
      context: .
      target: web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - web
      - backend
    volumes:
      - storage-data:/var/www/storage:ro
    depends_on:
      app:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.kitsuluh.rule=Host(`kitcrm.krakatau-it.co.id`)
      - traefik.http.routers.kitsuluh.entrypoints=web
      - traefik.http.services.kitsuluh.loadbalancer.server.port=80

  scheduler:
    <<: *app-service
    command: php artisan schedule:work
    depends_on:
      postgres:
        condition: service_healthy

  queue-worker:
    <<: *app-service
    command: php artisan queue:work --tries=3 --timeout=3600 --sleep=3
    stop_grace_period: 1h
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitsuluh
      POSTGRES_PASSWORD: password.1
      POSTGRES_DB: kitsuluh
    networks:
      - backend
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kitsuluh", "-d", "kitsuluh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  storage-data:
  bootstrap-cache:

networks:
  web:
    external: true
    name: web
  backend:
    driver: bridge
