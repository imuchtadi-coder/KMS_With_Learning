x-app-service: &app-service
  image: kitsuluh-app:${APP_IMAGE_TAG:-latest}
  build:
    context: .
    target: app
  restart: unless-stopped
  env_file:
    - ${APP_ENV_FILE:-.env}
  networks:
    - backend
  volumes:
    - storage-data:/var/www/storage
    - bootstrap-cache:/var/www/bootstrap/cache

services:
  app:
    <<: *app-service
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: kitsuluh-web:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - web
      - backend
    volumes:
      - storage-data:/var/www/storage:ro
    depends_on:
      app:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.kitsuluh-prod.rule=Host(`kitsuluh.krakatau-it.co.id`)
      - traefik.http.routers.kitsuluh-prod.entrypoints=web
      - traefik.http.services.kitsuluh-prod.loadbalancer.server.port=80

      # - "traefik.enable=true"
      # - "traefik.docker.network=${TRAEFIK_NETWORK:-web}"
      # # Use deployment-specific names because Traefik router, middleware, and
      # # service names are global across every container on the shared network.
      # # Public HTTPS terminates at Cloudflare. The shared Traefik origin only
      # # accepts HTTP, so this router must not enable TLS or redirect to HTTPS.
      # - "traefik.http.routers.kitsuluh-prod.rule=Host(`${APP_DOMAIN:-kitsuluh.krakatau-it.co.id}`)"
      # - "traefik.http.routers.kitsuluh-prod.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}"
      # - "traefik.http.routers.kitsuluh-prod.middlewares=kitsuluh-prod-forwarded-https"
      # - "traefik.http.routers.kitsuluh-prod.priority=1000"
      # - "traefik.http.routers.kitsuluh-prod.service=kitsuluh-prod-web"
      # # Preserve the public scheme seen by the browser. Laravel therefore
      # # generates HTTPS URLs and accepts secure cookies although the hop from
      # # Cloudflare to Traefik is plain HTTP.
      # - "traefik.http.middlewares.kitsuluh-prod-forwarded-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      # - "traefik.http.middlewares.kitsuluh-prod-forwarded-https.headers.customrequestheaders.X-Forwarded-Port=443"
      # - "traefik.http.services.kitsuluh-prod-web.loadbalancer.server.port=80"

  scheduler:
    <<: *app-service
    command: php artisan schedule:work
    depends_on:
      postgres:
        condition: service_healthy

  queue-worker:
    <<: *app-service
    command: php artisan queue:work --tries=3 --timeout=3600 --sleep=3
    stop_grace_period: 1h
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    networks:
      - backend
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  storage-data:
  bootstrap-cache:

networks:
  web:
    external: true
    name: ${TRAEFIK_NETWORK:-web}
  backend:
    driver: bridge
