x-app-service: &app-service
  image: kitsuluh-app:${APP_IMAGE_TAG:-latest}
  build:
    context: .
    target: app
  restart: unless-stopped
  env_file:
    - ${APP_ENV_FILE:-.env}
  networks:
    - backend
  volumes:
    - storage-data:/var/www/storage
    - bootstrap-cache:/var/www/bootstrap/cache

services:
  app:
    <<: *app-service
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: kitsuluh-web:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - web
      - backend
    volumes:
      - storage-data:/var/www/storage:ro
    depends_on:
      app:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-web}"
      - "traefik.http.routers.kitsuluh-http.rule=Host(`${APP_DOMAIN:-kitsuluh.krakatau-it.co.id}`)"
      - "traefik.http.routers.kitsuluh-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}"
      - "traefik.http.routers.kitsuluh-http.middlewares=kitsuluh-https-redirect"
      - "traefik.http.middlewares.kitsuluh-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.kitsuluh-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.kitsuluh.rule=Host(`${APP_DOMAIN:-kitsuluh.krakatau-it.co.id}`)"
      - "traefik.http.routers.kitsuluh.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.kitsuluh.tls=true"
      - "traefik.http.services.kitsuluh.loadbalancer.server.port=80"

  scheduler:
    <<: *app-service
    command: php artisan schedule:work
    depends_on:
      postgres:
        condition: service_healthy

  queue-worker:
    <<: *app-service
    command: php artisan queue:work --tries=3 --timeout=3600 --sleep=3
    stop_grace_period: 1h
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    networks:
      - backend
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  storage-data:
  bootstrap-cache:

networks:
  web:
    external: true
    name: ${TRAEFIK_NETWORK:-web}
  backend:
    driver: bridge
