services:

  app:
    build: .
    container_name: kitsuluh-app
    restart: always
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - kitsuluh

  nginx:
    image: nginx:alpine
    container_name: kitsuluh-nginx
    restart: always
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - kitsuluh
    depends_on:
      - app
    ports:
      - "80:80"

  scheduler:
    build: .
    container_name: kitsuluh-scheduler
    restart: always
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    networks:
      - kitsuluh
    depends_on:
      - postgres

  queue-worker:
    build: .
    container_name: kitsuluh-queue
    restart: always
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --timeout=3600
    volumes:
      - ./:/var/www
    networks:
      - kitsuluh
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: kitsuluh-postgres
    restart: always
    environment:
      POSTGRES_USER: kitsuluh
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: lmskit
    ports:
      - "5432:5432"
    networks:
      - kitsuluh
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

networks:
  kitsuluh:
    external: true
